name: Deploy backend

# Push to main (backend or database files changed) -> test -> build zip -> update the backend Lambda -> smoke test.
# Also updates the four Cognito trigger Lambdas when their code changed, and can run the database migration on demand
# (Run workflow -> tick "migrate"). Migrations are never run automatically because they change the production database.
# AWS access: an OIDC role when the variable AWS_DEPLOY_ROLE_ARN is set, otherwise an IAM user's access key from
# the secrets AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY. Setup steps: infra/README.md, section "CI/CD".
# The infrastructure itself is not deployed here (see infra/deploy.ps1).

on:
  push:
    branches: [main]
    paths: ['backend/**', 'database/**', '.github/workflows/deploy-backend.yml']
  workflow_dispatch:
    inputs:
      deploy_triggers:
        description: Also update the four Cognito trigger Lambdas
        type: boolean
        default: false
      migrate:
        description: Run the database migration after the update (changes the production database)
        type: boolean
        default: false

# One deployment at a time; a newer push waits instead of cancelling a running deployment.
concurrency:
  group: deploy-backend
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: ap-southeast-2
  FUNCTION_NAME: ${{ vars.LAMBDA_FUNCTION_NAME || 'cs361-coop-api' }}
  TRIGGER_PREFIX: ${{ vars.TRIGGER_FUNCTION_PREFIX || 'cs361-coop' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        working-directory: backend
        run: npm ci
      # These tests need no database. The API integration tests (tests/api.test.mjs) need PostgreSQL and run locally.
      - name: Unit tests (Cognito triggers)
        run: node --test backend/tests/cognito-triggers.test.mjs

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write # lets the job request an OIDC token for AWS
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the change detection below compares with the previous commit
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Detect what changed
        id: changes
        run: |
          set -euo pipefail
          triggers=false
          migrations=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            triggers="${{ inputs.deploy_triggers }}"
          else
            before="${{ github.event.before }}"
            if [ -z "$before" ] || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
              files="$(git ls-files)"
            else
              files="$(git diff --name-only "$before" "${{ github.sha }}")"
            fi
            if grep -q '^backend/cognito-triggers/' <<< "$files"; then triggers=true; fi
            if grep -q '^database/migrations/' <<< "$files"; then migrations=true; fi
          fi
          echo "triggers=$triggers" >> "$GITHUB_OUTPUT"
          echo "migrations=$migrations" >> "$GITHUB_OUTPUT"
          echo "trigger code changed or requested: $triggers; new migration files: $migrations"

      - name: Build the Lambda package
        run: |
          set -euo pipefail
          cd backend
          rm -rf build function.zip
          mkdir build
          cp -r src cognito-triggers package.json package-lock.json build/
          mkdir -p build/src/schema
          cp -r ../database/init ../database/migrations ../database/seeds build/src/schema/
          cd build
          npm ci --omit=dev --no-audit --no-fund
          zip -qr ../function.zip src cognito-triggers node_modules package.json
          cd ..
          ls -lh function.zip
          unzip -l function.zip | grep -E "src/lambda.js|cognito-triggers/verify-auth-challenge/index.mjs|src/schema/migrations/" | head

      # Preferred: a role that GitHub assumes through OIDC (no stored key). Set the variable AWS_DEPLOY_ROLE_ARN to use it.
      - name: Configure AWS credentials (OIDC role)
        if: ${{ vars.AWS_DEPLOY_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Fallback when the organization blocks OIDC: an IAM user whose key lives in GitHub secrets.
      - name: Configure AWS credentials (access key)
        if: ${{ vars.AWS_DEPLOY_ROLE_ARN == '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Show the version that is live before the update
        run: |
          aws lambda get-function-configuration --function-name "$FUNCTION_NAME" \
            --query '{LastModified:LastModified,CodeSha256:CodeSha256,Runtime:Runtime}' --output table

      # --publish also stores the new code as a numbered version, so older code stays available for rollback.
      - name: Update the Lambda code
        run: |
          set -euo pipefail
          aws lambda update-function-code --function-name "$FUNCTION_NAME" \
            --zip-file fileb://backend/function.zip --publish \
            --query '{Version:Version,CodeSha256:CodeSha256}' --output table
          aws lambda wait function-updated --function-name "$FUNCTION_NAME"

      # Only when a file in backend/cognito-triggers changed (or "deploy_triggers" was ticked).
      # Environment variables of the triggers (TU_API_KEY, MOCK_*) are not touched by a code update.
      - name: Update the Cognito trigger Lambdas
        if: ${{ steps.changes.outputs.triggers == 'true' }}
        run: |
          set -euo pipefail
          for name in pre-sign-up define-auth-challenge create-auth-challenge verify-auth-challenge; do
            # The hand-made production Lambdas are named without the "-challenge" suffix (cs361-coop-define-auth),
            # the ones created by infra/app.yaml keep it. Use whichever exists.
            function=""
            for candidate in "${TRIGGER_PREFIX}-${name}" "${TRIGGER_PREFIX}-${name%-challenge}"; do
              if aws lambda get-function-configuration --function-name "$candidate" > /dev/null 2>&1; then
                function="$candidate"
                break
              fi
            done
            if [ -z "$function" ]; then echo "No Lambda found for trigger ${name} (prefix ${TRIGGER_PREFIX})"; exit 1; fi
            echo "${name} -> ${function}"
            (cd "backend/cognito-triggers/${name}" && zip -q "${RUNNER_TEMP}/${name}.zip" index.mjs)
            aws lambda update-function-code --function-name "$function" \
              --zip-file "fileb://${RUNNER_TEMP}/${name}.zip" --publish \
              --query '{Function:FunctionName,Version:Version}' --output text
            aws lambda wait function-updated --function-name "$function"
          done

      # Migrations change the production database, so they are never run on their own. Tell the person who merged.
      - name: Remind about new migration files
        if: ${{ steps.changes.outputs.migrations == 'true' && inputs.migrate != true }}
        run: |
          echo "::warning title=New migration files::database/migrations changed. Take an RDS snapshot, then run this workflow manually (Run workflow) with migrate ticked."

      - name: Run the database migration
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.migrate == true }}
        run: |
          set -euo pipefail
          echo '{"action":"migrate","seeds":false}' > "${RUNNER_TEMP}/migrate-payload.json"
          error="$(aws lambda invoke --function-name "$FUNCTION_NAME" \
            --payload "fileb://${RUNNER_TEMP}/migrate-payload.json" --cli-read-timeout 300 \
            --query FunctionError --output text "${RUNNER_TEMP}/migrate-result.json")"
          cat "${RUNNER_TEMP}/migrate-result.json"; echo
          if [ "$error" != "None" ]; then echo "Migration failed ($error)"; exit 1; fi

      - name: Smoke test
        if: ${{ vars.API_URL != '' }}
        run: |
          set -u
          for attempt in 1 2 3 4 5; do
            status=$(curl -s -o /dev/null -w '%{http_code}' "${{ vars.API_URL }}/health" || true)
            echo "attempt $attempt: GET /health -> HTTP $status"
            if [ "$status" = "200" ]; then exit 0; fi
            sleep 10
          done
          echo "Smoke test failed. To roll back, revert the commit and push (this workflow redeploys the previous code)."
          exit 1

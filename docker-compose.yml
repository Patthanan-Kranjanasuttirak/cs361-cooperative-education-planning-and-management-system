version: '3.8'

services:
  # --------------------------------------------------
  # Frontend Service
  # --------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cs361_frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    restart: unless-stopped

  # --------------------------------------------------
  # Backend Service
  # --------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cs361_backend
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      # ดึงตัวแปรจาก .env มาต่อ String เป็น JDBC URL
      - SPRING_DATASOURCE_URL=jdbc:postgresql://database:5432/${DB_NAME}
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
    depends_on:
      - database
    restart: unless-stopped

  # --------------------------------------------------
  # Database Service (PostgreSQL)
  # --------------------------------------------------
  database:
    image: postgres:16-alpine
    container_name: cs361_database
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d
    restart: unless-stopped

# ----------------------------------------------------
# Persistent Volumes
# ----------------------------------------------------
volumes:
  db_data: